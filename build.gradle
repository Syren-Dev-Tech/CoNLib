buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'maven.neoforged.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'groovy'
    id 'eclipse'
    id 'maven-publish'
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
    id 'net.neoforged.moddev.legacyforge' version "${neoforge_version}" apply false
    id 'org.parchmentmc.librarian.forgegradle' version '1.+' apply false
    id 'org.spongepowered.mixin' version '0.7.+' apply false
}

group = mod_group_id
version = mod_version

// Set temp variable for artifact ID
def artifact_id = ""

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

def isForge = project.hasProperty('forge') && project.forge == 'true'
def isFabric = project.hasProperty('fabric') && project.fabric == 'true'
def isNeoForge = project.hasProperty('neoforge') && project.neoforge == 'true'

if (isForge) {
    println "Building with Forge (root redirected to forge/)"

    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'org.spongepowered.mixin'
    apply plugin: 'org.parchmentmc.librarian.forgegradle'

    sourceSets.main.java.srcDirs = [file('forge/src/main/java')]
    sourceSets.main.resources.srcDirs = [file('forge/src/main/resources')]
    sourceSets.test.java.srcDirs = [file('forge/src/test/java')]
    sourceSets.test.resources.srcDirs = [file('forge/src/test/resources')]
    // Exclude fabric and neoforge content
    sourceSets.main.java.exclude '**/fabric/**', '**/neoforge/**'
    // Use root build.gradle logic for configuration

    dependencies {
        minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
        implementation 'com.github.syren_dev_tech:scylla_forge:1.0.0'
    }

    minecraft {
        mappings channel: mapping_channel, version: "${parchment_version}-${minecraft_version}"
        runs {
            client {
                workingDirectory project.file('run')
                property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
                property 'forge.logging.console.level', 'debug'
            }
        }
    }

} else if (isFabric) {
    println "Building with Fabric (root)"

    apply plugin: 'fabric-loom'

    sourceSets.main.java.srcDirs = [file('fabric/src/main/java')]
    sourceSets.main.resources.srcDirs = [file('fabric/src/main/resources')]
    sourceSets.test.java.srcDirs = [file('fabric/src/test/java')]
    sourceSets.test.resources.srcDirs = [file('fabric/src/test/resources')]
    // Exclude forge and neoforge content
    sourceSets.main.java.exclude '**/forge/**', '**/neoforge/**'
    // Use root build.gradle logic for configuration

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
        }
        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        modImplementation('com.github.syren_dev_tech:scylla_fabric:1.0.0')
    }

    loom {
        runs {
            client {
                property 'fabric.debug', 'true'
            }
        }
    }
} else if (isNeoForge) {
    println "Building with NeoForge (root)"

    apply plugin: 'net.neoforged.moddev.legacyforge'

    sourceSets.main.java.srcDirs = [file('neoforge/src/main/java')]
    sourceSets.main.resources.srcDirs = [file('neoforge/src/main/resources')]
    sourceSets.test.java.srcDirs = [file('neoforge/src/test/java')]
    sourceSets.test.resources.srcDirs = [file('neoforge/src/test/resources')]
    // Exclude forge and fabric content
    sourceSets.main.java.exclude '**/forge/**', '**/fabric/**'
    // Use root build.gradle logic for configuration

    dependencies {
        implementation 'com.github.syren_dev_tech:scylla_neoforge:1.0.0'
        implementation "org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip"
    }

    legacyForge {
        version = "${minecraft_version}-${forge_version}"
    }
} else {
    println "No platform property set. Please specify -Pforge, -Pfabric, or -Pneoforge."
    throw new GradleException("No platform property set.")
}

repositories {
    mavenCentral()
    maven { url 'libraries.minecraft.net' }
    maven { url 'https://maven.minecraftforge.net' }
    maven { url 'https://repo.spongepowered.org/maven' }
    maven { url 'https://maven.neoforged.net/' }
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.parchmentmc.org/' }
    maven { url 'https://syren-dev-tech.github.io/scylla-core/'}
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId "${artifact_id}"
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/dist"
        }
    }
}