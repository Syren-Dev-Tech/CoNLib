plugins {
    id 'net.neoforged.moddev.legacyforge' version '2.0.134' // Use a version that supports 1.20.1
    id 'groovy' // Optional, if using Groovy for build script logic
}

// apply from: '../common/build.gradle'

// Read properties from gradle.properties
version = mod_version
group = mod_group_id
archivesBaseName = mod_id

// Set Java compatibility to Java 17, which is required for Minecraft 1.20.1
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    // Add repositories for any additional dependencies (e.g., JEI)
}

dependencies {
    // The "net.neoforged.moddev.legacyforge" plugin automatically adds the NeoForge dependencies
    // Add your own dependencies here
    // implementation 'org.example:example-library:1.0.0'
    compileOnly project(":common")
}

// General modding configuration
// neoforge {
//     // You can set mapping versions here, but it's often done in gradle.properties
//     parchment {
//         minecraftVersion = minecraft_version
//         mappingsVersion = parchment_version // Get version from parchmentmc.org
//     }
// }

// Configure the JAR file
// jar {
//     manifest {
//         attributes([
//             // "FMLModType": "GAMELIBRARY&FORGELIBRARY" // Example, check NeoForge docs for correct value
//         ])
//     }
// }

// Process resources to substitute variables (like ${mod_id}) from gradle.properties into your mods.toml file
tasks.withType(ProcessResources).configureEach {
    def props = [
        // Add all properties you want to be replaced in resource files
        'mod_id': mod_id,
        'mod_name': mod_name,
        'mod_version': mod_version,
        'mod_license': mod_license,
        'mod_authors': mod_authors,
        'minecraft_version': minecraft_version
    ]
    inputs.properties props
    filteringCharset 'UTF-8'
    filesMatching(['META-INF/mods.toml']) {
        expand props
    }
}
