buildscript {
    repositories {
        mavenLocal()
        mavenCentral()
        gradlePluginPortal()
        maven { url = 'maven.neoforged.net' }
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'java'
    id 'idea'
    id 'groovy'
    id 'eclipse'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'fabric-loom' version "${loom_version}" apply false
    id 'net.minecraftforge.gradle' version '[6.0,6.2)' apply false
    id 'net.neoforged.moddev.legacyforge' version "${neoforge_version}" apply false
    id 'org.parchmentmc.librarian.forgegradle' version '1.+' apply false
    id 'org.spongepowered.mixin' version '0.7.+' apply false
}

group = mod_group_id
version = mod_version

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(17))
    }
}

configurations {
    shadowed
}

def isForge = project.hasProperty('forge') && project.forge == 'true'
def isFabric = project.hasProperty('fabric') && project.fabric == 'true'
def isNeoForge = project.hasProperty('neoforge') && project.neoforge == 'true'

def allBuilds(artifact_id) {
    shadowJar {
        println "Configuring shadowJar task"

        configurations = [project.configurations.shadowed]
        mergeServiceFiles()

        archiveClassifier = ''

        manifest {
            attributes([
                "Specification-Title": mod_name,
                "Specification-Vendor": mod_authors,
                "Specification-Version": mod_version,
                "Implementation-Title": mod_name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor": mod_authors,
            ])
        }

        finalizedBy 'reobfJar'
    }

    artifacts {
        archives jar
        archives shadowJar
    }

    publishing {
        publications {
            register('mavenJava', MavenPublication) {
                artifactId "${artifact_id}"
                artifact tasks.named('shadowJar').get().archiveFile.get().asFile
            }
        }
    }
}

// Define function that runs a Forge-specific block
def withForge() {
    println "Building with Forge"

    apply plugin: 'net.minecraftforge.gradle'
    apply plugin: 'org.spongepowered.mixin'
    apply plugin: 'org.parchmentmc.librarian.forgegradle'

    sourceSets.main.java.srcDirs = [file('forge/src/main/java')]
    sourceSets.main.resources.srcDirs = [file('forge/src/main/resources')]
    sourceSets.test.java.srcDirs = [file('forge/src/test/java')]
    sourceSets.test.resources.srcDirs = [file('forge/src/test/resources')]
    // Exclude fabric and neoforge content
    sourceSets.main.java.exclude '**/fabric/**', '**/neoforge/**'
    // Use root build.gradle logic for configuration

    dependencies {
        minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
        implementation "com.github.syren_dev_tech:scylla_core_forge:${scylla_core_version}"
        shadowed "com.github.syren_dev_tech:scylla_core_forge:${scylla_core_version}"
    }

    jar {
        archiveClassifier = 'slim' // Adds '-slim' to the regular jar's filename

        manifest {
            attributes([
                "FMLModType": "GAMELIBRARY", // Adjust as needed
                "Manifest-Version": "1.0"
            ])
        }

        finalizedBy 'reobfJar'
    }

    minecraft {
        mappings channel: mapping_channel, version: "${parchment_version}-${minecraft_version}"
        runs {
            client {
                workingDirectory project.file('run')
                property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
                property 'forge.logging.console.level', 'debug'
            }
        }
    }

    reobf {
        shadowJar {} // Apply reobfuscation settings to the shadowJar task
    }

    tasks.withType(ProcessResources).configureEach {
        var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            geckolib_version: geckolib_version,
        ]
        inputs.properties replaceProperties

        filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/mods.toml', 'pack.mcmeta']) {
            expand replaceProperties + [project: project]
        }
    }

    tasks.build.dependsOn 'shadowJar'
}

def withFabric() {
    println "Building with Fabric"

    apply plugin: 'fabric-loom'

    sourceSets.main.java.srcDirs = [file('fabric/src/main/java')]
    sourceSets.main.resources.srcDirs = [file('fabric/src/main/resources')]
    sourceSets.test.java.srcDirs = [file('fabric/src/test/java')]
    sourceSets.test.resources.srcDirs = [file('fabric/src/test/resources')]
    // Exclude forge and neoforge content
    sourceSets.main.java.exclude '**/forge/**', '**/neoforge/**'
    // Use root build.gradle logic for configuration

    dependencies {
        minecraft "com.mojang:minecraft:${minecraft_version}"
        mappings loom.layered() {
            officialMojangMappings()
            parchment("org.parchmentmc.data:parchment-${minecraft_version}:${parchment_version}@zip")
        }
        modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
        modImplementation "com.github.syren_dev_tech:scylla_core_fabric:${scylla_core_version}"
        shadowed "com.github.syren_dev_tech:scylla_core_fabric:${scylla_core_version}"
    }

    loom {
        runs {
            client {
                property 'fabric.debug', 'true'
            }
        }
    }
}

def withNeoForge() {
    println "Building with NeoForge"

    apply plugin: 'net.neoforged.moddev.legacyforge'

    sourceSets.main.java.srcDirs = [file('neoforge/src/main/java')]
    sourceSets.main.resources.srcDirs = [file('neoforge/src/main/resources')]
    sourceSets.test.java.srcDirs = [file('neoforge/src/test/java')]
    sourceSets.test.resources.srcDirs = [file('neoforge/src/test/resources')]
    // Exclude forge and fabric content
    sourceSets.main.java.exclude '**/forge/**', '**/fabric/**'
    // Use root build.gradle logic for configuration

    dependencies {
        implementation "com.github.syren_dev_tech:scylla_core_neoforge:${scylla_core_version}"
        implementation "org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip"
        shadowed "com.github.syren_dev_tech:scylla_core_neoforge:${scylla_core_version}"
    }

    jar {
        archiveClassifier = 'slim' // Adds '-slim' to the regular jar's filename

        manifest {
            attributes([
                "Specification-Title": mod_name,
                "Specification-Vendor": mod_authors,
                "Specification-Version": mod_version,
                "Implementation-Title": mod_name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor": mod_authors,
            ])
        }

        finalizedBy 'reobfJar'
    }

    legacyForge {
        version = "${minecraft_version}-${forge_version}"

        validateAccessTransformers = true

        runs {
            client {
                client()
            }
            data {
                data()
            }
            server {
                server()
            }
        }

        mods {
            testproject {
                sourceSet sourceSets.main
            }
        }
    }

    tasks.withType(ProcessResources).configureEach {
        var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
            geckolib_version: geckolib_version,
        ]
        inputs.properties replaceProperties

        filesMatching(['META-INF/neoforge.mods.toml', 'META-INF/mods.toml', 'pack.mcmeta']) {
            expand replaceProperties + [project: project]
        }
    }

    tasks.build.dependsOn 'shadowJar'
}

if (isForge) {
    withForge()
    allBuilds("${mod_id}_forge")
} 
else if (isFabric) {
    withFabric()
    allBuilds("${mod_id}_fabric")
} 
else if (isNeoForge) {
    if (minecraft_version == '1.20.1') {
        withForge()
    } 
    else {
        withNeoForge()
    }
    allBuilds("${mod_id}_neoforge")
}
else {
    println "No platform property set. Please specify -Pforge, -Pfabric, or -Pneoforge."
    throw new GradleException("No platform property set.")
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url 'libraries.minecraft.net' }
    maven { url 'https://maven.minecraftforge.net' }
    maven { url 'https://repo.spongepowered.org/maven' }
    maven { url 'https://maven.neoforged.net/' }
    maven { url 'https://maven.fabricmc.net/' }
    maven { url 'https://maven.parchmentmc.org/' }
    maven { url 'https://syren-dev-tech.github.io/scylla-core/'}
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroupByRegex("software\\.bernie.*")
            includeGroup("com.eliotlash.mclib")
        }
    }
}